services:
  postgres:
    image: postgres:17-alpine
    container_name: supply-manager-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: supply
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      POSTGRES_DB: supply_manager

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supply -d supply_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: